<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор натяжных потолков</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f3f6fb;color:#1c2430;padding:18px;max-width:480px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
h1 span{color:#1976d2}
.sub{color:#6b7787;font-size:14px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(25,118,210,.08)}
label{display:block;font-size:13px;color:#6b7787;margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #d5deea;font-size:17px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:16px}
.chk input{width:20px;height:20px}
.big{font-size:36px;font-weight:800;color:#1976d2}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #edf1f7;font-size:15px}
button{width:100%;margin-top:6px;padding:14px;border:0;border-radius:12px;background:#1976d2;color:#fff;font-weight:700;font-size:17px}
#ok{display:none;color:#2e7d32;margin-top:10px;font-weight:600}
</style>
</head>
<body>
<h1>Калькулятор <span>натяжных потолков</span></h1>
<div class="sub">Узнайте примерную цену за 30 секунд</div>
<div class="card">
<div class="row">
<div><label>Длина, м</label><input id="L" type="number" step="0.1" value="5" oninput="calc()"></div>
<div><label>Ширина, м</label><input id="W" type="number" step="0.1" value="4" oninput="calc()"></div>
</div>
<label>Тип полотна</label>
<select id="type" onchange="calc()">
<option value="450">Матовое, 450 ₽/м²</option>
<option value="550" selected>Сатиновое, 550 ₽/м²</option>
<option value="650">Глянцевое, 650 ₽/м²</option>
<option value="950">Тканевое, 950 ₽/м²</option>
</select>
<div class="row">
<div><label>Светильников, шт</label><input id="sp" type="number" value="6" oninput="calc()"></div>
<div><label>Люстр, шт</label><input id="ch" type="number" value="1" oninput="calc()"></div>
</div>
<div class="chk"><input id="corn" type="checkbox" onchange="calc()"><span>Скрытый карниз для штор (+1 500 ₽/м)</span></div>
</div>
<div class="card">
<div class="sub">Примерная стоимость</div>
<div class="big" id="total">—</div>
<div class="line"><span>Площадь</span><b id="area"></b></div>
<div class="line"><span>Полотно</span><b id="cl"></b></div>
<div class="line"><span>Светильники и люстры</span><b id="lm"></b></div>
<div class="line"><span>Карниз</span><b id="cn"></b></div>
</div>
<div class="card">
<input id="ph" type="tel" placeholder="Ваш телефон">
<button onclick="send()">Заказать замер бесплатно</button>
<div id="ok">Спасибо! Мастер позвонит в течение 15 минут.</div>
</div>
<script>
function n(id){return parseFloat(document.getElementById(id).value)||0}
function fmt(x){return Math.round(x).toLocaleString('ru-RU')+' ₽'}
function calc(){
  var L=n('L'),W=n('W'),a=L*W;
  var cloth=a*n('type');
  var lamps=n('sp')*350+n('ch')*500;
  var corn=document.getElementById('corn').checked?(L*1500):0;
  var t=cloth+lamps+corn;
  document.getElementById('area').textContent=a.toFixed(1)+' м²';
  document.getElementById('cl').textContent=fmt(cloth);
  document.getElementById('lm').textContent=fmt(lamps);
  document.getElementById('cn').textContent=corn?fmt(corn):'—';
  document.getElementById('total').textContent=fmt(t);
}
function send(){document.getElementById('ok').style.display='block'}
calc();
</script>
</body>
</html>
