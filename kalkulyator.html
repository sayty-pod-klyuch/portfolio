<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор плитки</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0b0b0b;color:#f2f2f2;padding:18px;max-width:480px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
h1 span{color:#ffc400}
.sub{color:#888;font-size:14px;margin-bottom:18px}
.card{background:#161616;border:1px solid #262626;border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;font-size:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#ffc400;color:#111;font-weight:800;font-size:17px}
.res{display:none}
.big{font-size:34px;font-weight:800;color:#ffc400}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}
</style>
</head>
<body>
<h1>Калькулятор <span>плитки</span></h1>
<div class="sub">Сколько плитки и клея нужно на пол или стену</div>

<div class="card">
<div class="row">
<div><label>Длина, м</label><input id="L" type="number" step="0.01" value="4"></div>
<div><label>Ширина, м</label><input id="W" type="number" step="0.01" value="3"></div>
</div>
<div class="row">
<div><label>Плитка: сторона A, см</label><input id="a" type="number" value="30"></div>
<div><label>Плитка: сторона B, см</label><input id="b" type="number" value="30"></div>
</div>
<div class="row">
<div><label>Запас на подрезку, %</label><input id="r" type="number" value="10"></div>
<div><label>Шов, мм</label><input id="s" type="number" step="0.5" value="2"></div>
</div>
<div class="row">
<div><label>Штук в упаковке</label><input id="p" type="number" value="11"></div>
<div><label>Цена за м², ₽</label><input id="c" type="number" value="1200"></div>
</div>
<button onclick="calc()">Рассчитать</button>
</div>

<div class="card res" id="res">
<div class="sub">Нужно плитки</div>
<div class="big" id="pcs">—</div>
<div class="line"><span>Площадь</span><b id="area"></b></div>
<div class="line"><span>Упаковок</span><b id="packs"></b></div>
<div class="line"><span>Клей (5 кг на м²)</span><b id="glue"></b></div>
<div class="line"><span>Стоимость плитки</span><b id="cost"></b></div>
</div>

<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  var area=v('L')*v('W');
  var s=v('s')/10; // мм -> см
  var tileArea=((v('a')+s)*(v('b')+s))/10000; // м²
  if(area<=0||tileArea<=0){return}
  var pcs=Math.ceil(area/tileArea*(1+v('r')/100));
  var packs=v('p')>0?Math.ceil(pcs/v('p')):0;
  var glueBags=Math.ceil(area*5/25); // мешки по 25 кг
  document.getElementById('pcs').textContent=pcs+' шт';
  document.getElementById('area').textContent=area.toFixed(2)+' м²';
  document.getElementById('packs').textContent=packs?packs+' уп.':'—';
  document.getElementById('glue').textContent=Math.ceil(area*5)+' кг ('+glueBags+' меш.)';
  document.getElementById('cost').textContent=Math.round(area*(1+v('r')/100)*v('c')).toLocaleString('ru-RU')+' ₽';
  document.getElementById('res').style.display='block';
}
</script>
</body>
</html>
